2026-09-05:
  Absolucy:
  - rscadd: You can now right-click a meteor sat capsule in your hand, or right click
      a meteor sat capsule with a multitool, to view a HUD previewing meteor sat coverage!
  - rscadd: This preview shows what's already covered by other active meteor sats
      (blue), what spots are solely covered by the current sat (green), and what spots
      are obscured due to walls or such (red).
  - qol: Ghost cafe players no longer count as "active" players, such as in the Plexora
      status or the top right stat panel.
  Gboster-0:
  - bugfix: borers now work with an ugly patchjob, awaiting a rework
2026-09-07:
  XeonMations:
  - bugfix: Disabling autopunctuation works again.
  - balance: Affluent quirk no longer spawns infinite money
  - bugfix: fixed longer do emotes not showing thinking indicator
  - bugfix: fixed AI mobs ignoring cooldowns
  - rscadd: Added the ability to rename guns with a pen.
2026-09-12:
  Absolucy:
  - balance: You can now upgrade the ORM to get more ore and more points per deposit.
  - bugfix: The stat panel's ping counter works again, instead of only average ping.
  - bugfix: Also, the average ping number at the top right is actually average now.
  FalloutFalcon:
  - bugfix: sawnoff recoil is ADDED to existing recoil rather then setting it
  - code_imp: Adds support for pre-sawnoff guns and cleans up sawnoff behavoir
  - image: landmarks for job icons refreshed with programmatic generation
  Hatterhat:
  - rscadd: Following a statistically significant amount of shady backroom deals,
      small quantities of the M/TACS-1-EX "Theseus", which matches the M/TACS-1-LF
      "Warden" for combat performance, have been rolled out to the Syndicate's Marauder
      Program.
  - bugfix: Warden exosuits now have functional zooming optics again.
  - bugfix: Marauders now get a properly unlimited agent card.
