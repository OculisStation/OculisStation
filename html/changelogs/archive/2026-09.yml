  - code_imp: Vampire fangs now handle all vampire blood-draining effects.
  - rscadd: Cybernetic fangs, unlocked via the Cybernetics tech node.
  sqnztb:
  - rscadd: Underwear can now be adjusted via the ctrl-shift-click interaction menu.
2026-09-15:
  Shroopy:
  - rscadd: Adds Backstage OOC, an OOC channel shared between security and antagonists.
  - rscadd: Adds Blueshields to SOOC.
  - bugfix: Fixed corrections officers not being notified if SOOC is toggled.
