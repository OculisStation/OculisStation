2026-09-26:
  Absolucy:
  - rscadd: Xenobiology is now literally slime rancher.
  - rscadd: Added vacuum packs for xenobiology - they can suck up slimes, recycle
      monkeys, spit out monkeys and creatures for the slimes to eat, and suck extracts
      towards you!
  - rscadd: Slime pens are now their own thing with cool barriers and such!
  - rscadd: Slime scanners are now used to remotely scan a slime and stay up to date
      on that specific slime's stats and such.
  - rscadd: Instead of freezing and mulching slimes for extracts, slimes now produce
      extracts when fed enough.
  - rscadd: Slimes now need to eat specific items or creatures in order to unlock
      specific mutations - the slime scanner will help you with this.
  - rscadd: Slimes won't split on their own - instead, you need to feed them "breeding
      pellets" from the biomass recycler, or if you are the slime's friend, order
      them to do so, and they will split or mutate whenever they can instead. This
      does not apply to "wild" slimes that haven't been in a pen recently, and player
      slimes can still manually split whenever.
  Shroopy:
  - rscadd: Added dice tracking to the *roll emote. You can now see the individual
      results for the dice you roll.
  - rscadd: Added more colors of gun case to the loadout.
  - balance: Removed the slowdown on security MODsuits.
  - balance: Increased the bullet protection of security MODsuits to match roundstart
      gear.
  - balance: Changed the default small storage modules in security MODsuits to full
      storage modules.
  - bugfix: Fixed ricochet projectiles missing targets.
  - balance: Buffed ricochet projectiles by making them actually hit targets.
  - bugfix: Fixed some chat hallucinations missing periods.
  - balance: Reverted the Affluent quirk taking money from the departmental budget.
