  - rscadd: Space parallax now works through cameras and other "external maps"
  - rscadd: Cameras and friends will no longer be incorrectly culled/shrunk when displaying
      a z level other then your own.
  - refactor: Fucked with how space parallax/the renderer thinks about "where" it
      is being displayed pretty heavily. Please report any weird visuals!
  - bugfix: Parallax draws as expected again
  MacaroniCritter:
  - map: Ocean Pubby has undergone a wide remodel
  Melbert:
  - rscadd: Adds two item acts - one to portable wind turbines, and one to propeller
      hats - that does something when you act with the items. No spoilers.
  Neocloudy:
  - bugfix: '[NOVA] Fixed the west-facing Sheathed pair size 2 (non-skintone) testicles
      sprite being offset.'
  Richard Blonski:
  - server: Added a debug command to reload photocopier templates without restarting
      the server.
  necromanceranne:
  - rscadd: Fangs, which now handle the functionality of pseudo-fang tongues. Felinids,
