2026-09-02:
  Absolucy:
  - bugfix: Fixed heretic sacrifice targets not being based on opt-in level, and instead
      only with specific jobs.
  Shroopy:
  - image: Slightly resprites the elite modsuit helmet, to lower it to where heads
      actually are.
  keygenpie:
  - rscadd: Added a blank anomaly kit, which can be fit with anomaly cores to create
